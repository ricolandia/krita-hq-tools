name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # O plugin roda em Windows também; o job de lá garante que os módulos
    # puros (caminhos, mapeamento, máscara, parser) não dependem de Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # numpy e Pillow são do script de vetorização de balões. Sem eles, o
      # TestVetorizador pulava em silêncio e o CI nunca exercitava o script.
      # As classes do kit (TestLoteDoAutor e TestAmostrasEmbarcadas) trabalham
      # sobre Referencias/, que é pasta local do autor fora do repositório:
      # elas pulam aqui de propósito, e a igualdade kit x amostras é conferida
      # na máquina do autor.
      - name: Dependências do script de vetorização
        run: python -m pip install --quiet numpy Pillow
      - name: Conferir que o teste do vetorizador não pulou
        # Em Python, e não com tee/grep: o job também roda no Windows.
        run: >-
          python -c "import subprocess, sys;
          r = subprocess.run([sys.executable, '-m', 'unittest',
          'tests.test_vetorizacao.TestVetorizador', '-v'],
          capture_output=True, text=True);
          saida = r.stdout + r.stderr;
          print(saida);
          sys.exit(1 if 'skipped' in saida else r.returncode)"
      - name: Rodar testes do núcleo (fora do Krita)
        run: python -m unittest discover -s tests -v
      - name: Validar que o ZIP instala (estrutura mínima)
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-zip.sh
          python -m zipfile -t dist/hq_tools-*.zip